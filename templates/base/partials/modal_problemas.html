{% comment %}
  Contenedor de la ventana del ⚠️ y su JavaScript (Fase 2, 23-10-2026). Se incluye
  una vez en las pantallas que pintan triángulos (Gestor de plantilla, Contratos).
  Cada triángulo llama a `abrirProblemas(url, event)`; el clic no se propaga a la fila.
{% endcomment %}
<style>
    .triangulo-problema { border: 0; background: transparent; padding: 0 .15rem; line-height: 1; cursor: pointer; }
    .triangulo-problema.critico { color: #dc2626; }
    /* Alta en AMARILLO (24-10-2026): el naranja anterior apenas se distinguía del
       rojo. El contorno oscuro lo hace visible también sobre fondo blanco. */
    .triangulo-problema.alto { color: #eab308; filter: drop-shadow(0 0 .6px #a16207); }
    .triangulo-problema:hover { transform: scale(1.15); }
    .triangulo-problema:focus-visible { outline: 2px solid currentColor; border-radius: 4px; }
    .problema-critico { border-left: 4px solid #dc2626 !important; }
    .problema-alto { border-left: 4px solid #eab308 !important; }
</style>
<div class="modal fade" id="modalProblemas" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable modal-lg">
        <div class="modal-content" id="contenidoProblemas"></div>
    </div>
</div>
<script>
    function abrirProblemas(url, evento) {
        if (evento) { evento.stopPropagation(); evento.preventDefault(); }
        const contenido = document.getElementById('contenidoProblemas');
        contenido.innerHTML = '<div class="modal-body text-center py-5"><div class="spinner-border text-primary"></div></div>';
        bootstrap.Modal.getOrCreateInstance(document.getElementById('modalProblemas')).show();
        fetch(url, { headers: { 'HX-Request': 'true', 'HX-Current-URL': window.location.href } })
            .then(r => { if (!r.ok) throw new Error('No se pudo cargar'); return r.text(); })
            .then(html => {
                contenido.innerHTML = html;
                if (window.htmx) htmx.process(contenido);
            })
            .catch(() => {
                contenido.innerHTML = '<div class="modal-body text-danger">No se pudieron cargar los problemas de este registro.</div>';
            });
    }
</script>
