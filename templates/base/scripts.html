<script>
  function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
  }
  const csrftoken = getCookie('csrftoken');

  // Aseguramos que htmx exista antes de configurar
  if (typeof htmx !== 'undefined') {
      htmx.on('htmx:configRequest', (event) => {
        if (['POST', 'PUT', 'DELETE'].includes(event.detail.verb)) {
          event.detail.headers['X-CSRFToken'] = csrftoken;
        }
      });
  }
</script>

<script>
  document.body.addEventListener('click', function (e) {
    const btn = e.target.closest('[data-swal-confirm][hx-post], [data-swal-confirm][hx-delete]');
    if (!btn) return;

    e.preventDefault();
    e.stopPropagation();
    
    const msg = btn.getAttribute('data-swal-confirm') || '¿Deseas continuar?';
    
    Swal.fire({
      title: '¿Estás seguro?',
      text: msg,
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#3085d6',
      cancelButtonColor: '#d33',
      confirmButtonText: /elimin/i.test(msg) ? 'Sí, ¡eliminar!' : 'Continuar',
      cancelButtonText: 'Cancelar'
    }).then((res) => {
      if (res.isConfirmed) {
        if (typeof htmx !== 'undefined') {
            htmx.trigger(btn, 'confirmed');
        }
      }
    });
  }, true);
</script>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const Toast = Swal.mixin({
            toast: true,
            position: 'top-end',
            showConfirmButton: false,
            timer: 3000,
            timerProgressBar: true,
            didOpen: (toast) => {
                toast.addEventListener('mouseenter', Swal.stopTimer)
                toast.addEventListener('mouseleave', Swal.resumeTimer)
            }
        });

        {% if messages %}
            {% for message in messages %}
                var type = "{{ message.tags }}";
                if(type === 'danger') type = 'error';
                if(type === 'debug') type = 'info';

                Toast.fire({
                    icon: type, 
                    title: "{{ message }}"
                });
            {% endfor %}
        {% endif %}
    });
</script>
