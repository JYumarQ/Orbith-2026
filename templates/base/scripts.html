<script>
  /* Toast único del proyecto: fondo blanco, borde y sombra, esquina superior
     derecha. Reemplaza las variantes sueltas (modal centrado, toast plano de
     Bootstrap) que convivían en distintos módulos con estilos distintos. */
  window.mostrarToast = function (mensaje, icono = 'success') {
    if (typeof Swal === 'undefined') { console.warn(mensaje); return; }
    const tipo = { danger: 'error', debug: 'info' }[icono] || icono;
    Swal.fire({
      toast: true,
      position: 'top-end',
      icon: ['success', 'error', 'warning', 'info', 'question'].includes(tipo) ? tipo : 'info',
      title: mensaje,
      showConfirmButton: false,
      timer: 3000,
      timerProgressBar: true,
      background: '#fff',
      color: '#697a8d',
      customClass: { popup: 'border shadow-lg' },
      didOpen: (toast) => {
        toast.addEventListener('mouseenter', Swal.stopTimer);
        toast.addEventListener('mouseleave', Swal.resumeTimer);
      }
    });
  };

  /* Escucha única del evento showMessage (HX-Trigger): cubre todos los flujos
     HTMX del proyecto (contratos, solicitudes, cargos, departamentos, unidades
     organizativas, aspirantes...), incluidos los que hasta ahora no tenían
     ningún listener propio. Soporta los tres formatos de payload usados hoy
     por el backend: string plano, objeto {icon, text}, y HX-Trigger sin
     detalle (lista de eventos separada por comas, ej. strorganizativa/views.py
     al eliminar una unidad organizativa — htmx entrega evt.detail vacío ahí). */
  document.body.addEventListener('showMessage', function (evt) {
    const detalle = (evt.detail && evt.detail.value !== undefined) ? evt.detail.value : evt.detail;
    if (typeof detalle === 'string' && detalle) {
      window.mostrarToast(detalle, 'success');
    } else if (detalle && typeof detalle === 'object' && Object.keys(detalle).length) {
      window.mostrarToast(detalle.text || 'Operación realizada.', detalle.icon || 'success');
    } else {
      window.mostrarToast('Operación realizada.', 'success');
    }
  });
</script>

<script>
  /* AYUDA CONTEXTUAL
     Los popovers de Bootstrap no se activan solos: hay que instanciarlos. Se
     hace aqui, para toda la aplicacion, y no en la pantalla que los estrene:
     asi cualquier plantilla puede poner un icono de ayuda con
     `data-bs-toggle="popover"` y funciona sin JavaScript propio.

     Se repite tras cada intercambio de HTMX y al abrir un modal, porque ahi
     llegan iconos nuevos que el barrido inicial no vio. */
  (function () {
    function activarAyuda(raiz) {
      if (typeof bootstrap === 'undefined') return;
      (raiz || document).querySelectorAll('[data-bs-toggle="popover"]').forEach(function (el) {
        if (!bootstrap.Popover.getInstance(el)) new bootstrap.Popover(el);
      });
    }
    window.orbithActivarAyuda = activarAyuda;

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function () { activarAyuda(); });
    } else {
      activarAyuda();
    }
    document.addEventListener('htmx:afterSettle', function (e) { activarAyuda(e.target); });
    document.addEventListener('shown.bs.modal', function (e) { activarAyuda(e.target); });
  })();

  function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
  }
  var csrftoken = getCookie('csrftoken');

  // Aseguramos que htmx exista antes de configurar
  if (typeof htmx !== 'undefined') {
      htmx.on('htmx:configRequest', (event) => {
        if (['POST', 'PUT', 'DELETE'].includes(event.detail.verb)) {
          event.detail.headers['X-CSRFToken'] = csrftoken;
        }
      });
  }
</script>

<script>
  document.body.addEventListener('click', function (e) {
    const btn = e.target.closest('[data-swal-confirm][hx-post], [data-swal-confirm][hx-delete]');
    if (!btn) return;

    e.preventDefault();
    e.stopPropagation();
    
    const msg = btn.getAttribute('data-swal-confirm') || '¿Deseas continuar?';
    
    Swal.fire({
      title: '¿Estás seguro?',
      text: msg,
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#3085d6',
      cancelButtonColor: '#d33',
      confirmButtonText: /elimin/i.test(msg) ? 'Sí, ¡eliminar!' : 'Continuar',
      cancelButtonText: 'Cancelar'
    }).then((res) => {
      if (res.isConfirmed) {
        if (typeof htmx !== 'undefined') {
            htmx.trigger(btn, 'confirmed');
        }
      }
    });
  }, true);
</script>
