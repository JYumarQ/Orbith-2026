{% for u in unidades %}
    <div id="unit-{{ u.pk }}" class="card mb-0 border-bottom nav-card unit-card"
         data-pk="{{ u.pk }}"
         data-desc="{{ u.descripcion }}"
         data-url-edit="{% url 'updt_uniorg' u.pk %}"
         data-url-del="{% url 'del_uniorg' u.pk %}"
         onclick="selectUnit(this)"
         hx-get="{% url 'htmx_load_departamentos' u.pk %}"
         hx-target="#col-departamentos"
         hx-swap="innerHTML"
         hx-indicator="#col-departamentos"
         style="cursor: pointer;">
         
        <div class="card-body p-2 d-flex align-items-center">
            
            <div class="me-3 text-secondary opacity-50" style="width: 20px; text-align: center;">
                <i class="fas fa-building"></i>
            </div>

            <div class="row flex-grow-1 m-0 align-items-center gx-2">
                
                <div class="col-6">
                    <h6 class="mb-0 fw-bold text-dark text-truncate" title="{{ u.descripcion }}" style="font-size: 0.85rem;">
                        {{ u.descripcion }}
                    </h6>
                </div>

                <div class="col-2">
                    <span class="badge bg-label-secondary border px-1 text-truncate w-100 text-center" style="font-size: 0.65rem;" title="Grupo de Nómina">
                        GN: {{ u.grupo_nomina }}
                    </span>
                </div>

                <div class="col-2">
                    <small class="text-muted fw-bold text-truncate d-block" style="font-size: 0.7rem;">
                        {{ u.tipo }}
                    </small>
                </div>

                <div class="col-2 text-end">
                    <span class="badge bg-label-primary" style="font-size: 0.65rem;">
                        <i class="fas fa-sitemap me-1" style="font-size: 0.6rem;"></i>{{ u.total_dptos }}
                    </span>
                </div>
            </div>

            <i class="fas fa-chevron-right text-muted opacity-25 ms-2" style="font-size: 0.7rem;"></i>
        </div>
    </div>
{% empty %}
    <div class="text-center py-4">
        <i class="fas fa-search fs-4 text-muted mb-2 opacity-25"></i>
        <p class="text-muted small m-0">Sin resultados.</p>
    </div>
{% endfor %}
