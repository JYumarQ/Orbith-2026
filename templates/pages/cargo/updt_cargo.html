<div class="modal-dialog" role="document">
    <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title" id="cargosModalLabel">Editar Cargo</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        
        <div class="modal-body">
            <form hx-post="{{ request.path }}" 
                  hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                  hx-target="#modal_generic"
                  hx-swap="innerHTML"
                  hx-confirm="¿Estás seguro de guardar los cambios?"
                  id="cargoForm">
                
                {% csrf_token %}
                
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Unidad Organizativa</label>
                        <input type="text" class="form-control" 
                            style="background-color: #e9ecef; color: #566a7f;" 
                            value="{{ form.instance.departamento.unidad_organizativa.descripcion }}" readonly>
                        <input type="hidden" name="unidad" value="{{ form.instance.departamento.unidad_organizativa.pk }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Departamento</label>
                        <input type="text" class="form-control" 
                            style="background-color: #e9ecef; color: #566a7f;" 
                            value="{{ form.instance.departamento.descripcion }}" readonly>
                        <input type="hidden" name="departamento" value="{{ form.instance.departamento.id }}">
                    </div>

                    <div class="col-12">
                        <label class="form-label">Cargo</label>
                        {{ form.ncargo }}
                    </div>

                    <div class="col-md-6">
                        <label class="form-label text-muted">Grupo Escala</label>
                        <input type="text" id="visual_grupo_escala" class="form-control" 
                            style="background-color: #e9ecef; color: #566a7f;"
                            readonly placeholder="Automático">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Rol</label>
                        {{ form.rol }}
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Nivel de Preparación</label>
                        {{ form.nivel_preparacion }}
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Cantidad Aprobada</label>
                        {{ form.cant_aprobada }}
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Cantidad Cubierta</label>
                        {{ form.cant_cubierta }} 
                    </div>
                    
                    <div class="col-md-6 d-flex flex-column justify-content-end ps-3 pb-1"> 
                        <div class="form-check form-switch mb-2">
                            {{ form.activo }}
                            <label class="form-check-label text-primary" for="{{ form.activo.id_for_label }}">
                                Activo
                            </label>
                        </div>

                        <div class="form-check form-switch">
                            {{ form.puesto_clave }}
                            <label class="form-check-label text-primary cursor-pointer" for="{{ form.puesto_clave.id_for_label }}">
                                Puesto Clave
                            </label>
                        </div>
                    </div>
                </div>

                <div class="modal-footer px-0 pb-0 mt-3">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
(function() {
    const form = document.getElementById('cargoForm');
    if (!form) return;

    // Referencias
    const $ncargo = $('#id_ncargo'); // jQuery para Select2
    const rol = form.querySelector('#id_rol');
    const inputGrupo = form.querySelector('#visual_grupo_escala');
    const cantCubierta = form.querySelector('[name="cant_cubierta"]');
    const cantAprobada = form.querySelector('#id_cant_aprobada'); 
    const checkActivo = form.querySelector('#id_activo');
    
    const urlInfoCargo = "/estructuras/categoria_ocupacional/";

    // --- 0. INICIALIZAR SELECT2 ---
    $ncargo.select2({
        dropdownParent: $('#modal_generic'),
        width: '100%',
        placeholder: "Buscar cargo...",
        language: { noResults: () => "No encontrado" }
    });

    // 1. Bloqueo
    if(cantCubierta) {
        cantCubierta.setAttribute('readonly', true);
        cantCubierta.style.backgroundColor = '#e9ecef';
        cantCubierta.style.color = '#566a7f';
    }

    // 2. Activo
    function actualizarEstadoActivo() {
        if (!cantAprobada || !checkActivo) return;
        const cantidad = parseInt(cantAprobada.value) || 0;
        checkActivo.checked = (cantidad > 0);

        checkActivo.removeAttribute('disabled');
        const wrapper = checkActivo.closest('.form-check');
        if (wrapper) {
            wrapper.style.pointerEvents = 'none';
        }
    }

    // 3. Lógica Datos Cargo Inteligente
    function actualizarDatosCargo() {
        const id = $ncargo.val(); 
        
        // Reset si borran la selección
        if (!id) {
            if(rol) {
                rol.removeAttribute('disabled');
                Array.from(rol.options).forEach(opt => { opt.hidden = false; opt.disabled = false; });
            }
            if(inputGrupo) inputGrupo.value = "";
            return;
        }

        fetch(`${urlInfoCargo}?id=${id}`, { headers: { 'Accept': 'application/json' } })
        .then(resp => resp.json())
        .then(data => {
            const grupo = data.grupo_escala || "";
            const cat = data.cat_ocupacional || "";
            
            if(inputGrupo) inputGrupo.value = grupo || "---";

            if (rol) {
                rol.removeAttribute('disabled');
                
                let opcionesValidas = 0;
                let ultimaOpcionValida = "";

                // Recorremos las opciones del select de Roles
                Array.from(rol.options).forEach(opt => {
                    // Ignoramos la opción por defecto vacía "---------"
                    if (!opt.value) {
                        opt.hidden = false; 
                        opt.disabled = false;
                        return;
                    }

                    const textoRol = opt.text.toUpperCase();
                    let mostrar = false;

                    // --- REGLAS DE NEGOCIO (Lógica Estricta por Categoría) ---
                    
                    // 1. Si la Categoría es Cuadro (CDI o CEJ), el único rol posible es Cuadro
                    if (cat === 'CDI' || cat === 'CEJ') {
                        if (textoRol.includes('CUADRO')) mostrar = true;
                    } 
                    
                    // 2. Si la Categoría NO es Cuadro (Técnico, Operario, etc.), JAMÁS se muestra Cuadro
                    else {
                        // Sub-regla: XXII, XXIII y XXIV solo pueden ser Decisorios
                        if (grupo === 'XXII' || grupo === 'XXIII' || grupo === 'XXIV') {
                            if (textoRol.includes('DECISORIO')) mostrar = true;
                        } 
                        // Para absolutamente todo el resto de los grupos (del I al XXI)
                        else {
                            if (textoRol.includes('FUNDAMENTAL') || textoRol.includes('DECISORIO') || textoRol.includes('APOYO')) {
                                mostrar = true;
                            }
                        }
                    }

                    // Aplicamos la visibilidad de forma segura para todos los navegadores
                    if (mostrar) {
                        opt.hidden = false;
                        opt.disabled = false;
                        opcionesValidas++;
                        ultimaOpcionValida = opt.value;
                    } else {
                        opt.hidden = true;
                        opt.disabled = true;
                        // Si la opción seleccionada actualmente se acaba de ocultar, la limpiamos
                        if (rol.value === opt.value) {
                            rol.value = ''; 
                        }
                    }
                });

                // MEJORA UX: Si después de filtrar solo quedó 1 opción válida, la seleccionamos automáticamente
                if (opcionesValidas === 1 && rol.value === '') {
                    rol.value = ultimaOpcionValida;
                }
            }
        })
        .catch(err => console.error('Error fetching cargo:', err));
    }

    if (cantAprobada) cantAprobada.addEventListener('input', actualizarEstadoActivo);
    
    // Listener jQuery
    $ncargo.on('change', actualizarDatosCargo);

    // Ejecución inicial (para cargar datos del cargo que ya viene al editar)
    actualizarDatosCargo();
    actualizarEstadoActivo();
})();
</script>
