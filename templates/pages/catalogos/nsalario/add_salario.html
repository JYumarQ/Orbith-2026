<div class="modal-dialog modal-dialog-centered modal-xl" role="document">
  <div class="modal-content">
    <div class="modal-header">
      <h5 class="modal-title" id="nsalariosModalLabel">Registrar Salarios</h5>
      <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>
    <div class="modal-body">
      <form method="post" id="formularioSalario" action="{% url 'agregar_salarios_modal' %}">
        {% csrf_token %}
        <input type="hidden" name="active_tab" value="salario">

        <div class="mb-4">
          <label for="{{ form.grupo_escala.id_for_label }}" class="form-label fw-bold">{{ form.grupo_escala.label }}</label>
          {{ form.grupo_escala }}
        </div>

        <div id="zona-mensajes" class="text-center py-4 text-muted">
            <i class="fas fa-hand-pointer fa-2x mb-2"></i>
            <p>Seleccione un Grupo Escala arriba para ver sus opciones</p>
        </div>

        <div id="caja_cuadro" class="card shadow-none border border-primary mb-4 bg-label-primary d-none">
            <div class="card-body">
                <label class="form-label fw-bold text-primary"><i class="fas fa-user-tie me-2"></i>Salario Básico para Cuadros</label>
                <div class="input-group" style="max-width: 300px;">
                    <span class="input-group-text bg-white border-primary border-end-0">$</span>
                    <input type="number" step="0.01" name="salario_cuadro" class="form-control fw-bold border-primary border-start-0 text-primary" placeholder="0.00">
                </div>
            </div>
        </div>

        <div id="caja_roles" class="table-responsive d-none">
            <label class="form-label fw-bold mb-2"><i class="fas fa-users me-2"></i>Matriz Salarial para Roles</label>
            <table class="table table-bordered align-middle">
              <thead class="table-light">
                <tr>
                  <th class="text-center" style="width: 20%;">Rol</th>
                  <th class="text-center" colspan="{{ tridentes|length }}">Desglose Salarial (Tridentes)</th>
                </tr>
                <tr class="text-muted small">
                  <th></th>
                  {% for t in tridentes %}
                    <th class="text-center">{{ t.tipo }}</th>
                  {% endfor %}
                </tr>
              </thead>
              <tbody>
                {% for r in roles %}
                  <tr class="fila-rol" data-rol-id="{{ r.id }}">
                    <td class="fw-bold ps-3">{{ r.tipo }}</td>
                    {% for t in tridentes %}
                      <td>
                        <input type="number" step="0.01" 
                               name="salario_{{ r.id }}_{{ t.id }}" 
                               class="form-control form-control-sm text-center salary-input"
                               placeholder="0.00">
                      </td>
                    {% endfor %}
                  </tr>
                {% endfor %}
              </tbody>
            </table>
        </div>

      </form>
    </div>
    
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" onclick="document.getElementById('formularioSalario').submit();">Guardar Salarios</button>
    </div>
  </div>
</div>

<script>
    // Usamos jQuery para asegurar compatibilidad con tu entorno
    $(document).ready(function() {
        // Leemos el mapa de grupos que envió Python
        const gruposData = {{ grupos_json|safe }};
        const $select = $('#{{ form.grupo_escala.id_for_label }}');
        
        const $zonaMensajes = $('#zona-mensajes');
        const $cajaCuadro = $('#caja_cuadro');
        const $cajaRoles = $('#caja_roles');

        // Función que decide qué mostrar
        function actualizarVista() {
            const groupId = $select.val();
            
            if(groupId && gruposData[groupId]) {
                const info = gruposData[groupId];
                $zonaMensajes.addClass('d-none');
                
                // Mostrar/Ocultar caja de Cuadro
                if(info.es_cuadro) $cajaCuadro.removeClass('d-none');
                else $cajaCuadro.addClass('d-none');

                // Mostrar/Ocultar tabla de Roles y filtrar filas
                if(info.tiene_rol) {
                    $cajaRoles.removeClass('d-none');
                    
                    // REGLA INTELIGENTE: Recorremos cada fila de la tabla
                    $('.fila-rol').each(function() {
                        const rolId = parseInt($(this).data('rol-id'));
                        
                        // Si el rol está en la lista de permitidos del grupo, lo mostramos
                        if (info.roles_permitidos.includes(rolId)) {
                            $(this).removeClass('d-none');
                            $(this).find('input').prop('disabled', false); // Activamos input
                        } else {
                            // Si no está permitido, lo ocultamos, lo deshabilitamos y lo vaciamos
                            $(this).addClass('d-none');
                            $(this).find('input').prop('disabled', true).val('');
                        }
                    });
                } else {
                    $cajaRoles.addClass('d-none');
                }
                
            } else {
                $zonaMensajes.removeClass('d-none');
                $cajaCuadro.addClass('d-none');
                $cajaRoles.addClass('d-none');
            }
        }

        // 1. Escuchar cuando cambias el select (funciona con Select2)
        $select.on('change', actualizarVista);
        
        // 2. Ejecutar inmediatamente al abrir por si el "I" ya está pre-seleccionado
        actualizarVista();
    });
</script>
