<div class="modal-dialog" role="document">
    <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title" id="uniorgModalLabel">Registrar Nueva Unidad</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        
        <div class="modal-body">
            <form hx-post="{{ request.path }}" 
                  hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                  hx-target="#modal_generic"
                  hx-swap="innerHTML"
                  hx-confirm="¿Estás seguro de guardar una nueva unidad organizativa?"
                  id="uniorgForm">
                
                {% csrf_token %}
                
                {{ form.as_p }}
                
                <div class="modal-footer px-0 pb-0">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function hacerFormularioInteligente() {
        const selectTipo = document.getElementById('id_tipo');
        const selectPadre = document.getElementById('id_padre');
        const inputNomina = document.getElementById('id_grupo_nomina');
        
        if (!selectTipo || !selectPadre || !inputNomina) return;

        // Desempaquetamos los datos que nos mandó la vista de Django
        const tiposInfo = JSON.parse('{{ tipos_info|safe|default:"{}" }}');
        const padresInfo = JSON.parse('{{ padres_info|safe|default:"{}" }}');
        
        function actualizarEstado() {
            const tipoId = selectTipo.value;
            // Verificamos si el tipo seleccionado está marcado como "es_subunidad" en base de datos
            const isSubunidad = tipoId ? tiposInfo[tipoId]?.es_subunidad : false;
            
            if (isSubunidad) {
                // REGLA: Es Subunidad
                selectPadre.removeAttribute('disabled'); // Activamos elegir padre
                
                inputNomina.setAttribute('readonly', 'readonly'); // Bloqueamos nómina
                inputNomina.style.backgroundColor = '#e9ecef';
                
                // Si ya eligió un padre, copiamos su grupo de nómina
                if (selectPadre.value && padresInfo[selectPadre.value]) {
                    inputNomina.value = padresInfo[selectPadre.value];
                } else {
                    inputNomina.value = "";
                    inputNomina.placeholder = "Seleccione Unidad Principal...";
                }
            } else {
                // REGLA: Es Principal o Normal
                selectPadre.setAttribute('disabled', 'disabled'); // Bloqueamos el padre
                selectPadre.value = ""; // Limpiamos el selector
                
                inputNomina.removeAttribute('readonly'); // Liberamos nómina
                inputNomina.style.backgroundColor = '';
                inputNomina.placeholder = "";
            }
        }
        
        actualizarEstado(); // Ejecutar nada más abrir el modal
        selectTipo.addEventListener('change', actualizarEstado);
        selectPadre.addEventListener('change', actualizarEstado);
    }
    
    hacerFormularioInteligente();
</script>
