<div class="modal-dialog" role="document">
    <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title" id="uniorgModalLabel">Editar Unidad</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" onclick="this.blur()"></button>
        </div>
        
        <div class="modal-body">
            <form hx-post="{{ request.path }}" 
                  hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                  hx-target="#modal_generic"
                  hx-swap="innerHTML"
                  
                  id="uniorgForm">
                
                {% csrf_token %}
                
                <div class="row g-3 mb-3">
                    <div class="col-12">
                        <label class="form-label fw-bold">{{ form.tipo.label }}</label>
                        {{ form.tipo }}
                    </div>
                    
                    <div class="col-12">
                        <label class="form-label fw-bold">{{ form.padre.label }}</label>
                        {{ form.padre }}
                    </div>
                    
                    <div class="col-12">
                        <label class="form-label fw-bold">{{ form.descripcion.label }}</label>
                        {{ form.descripcion }}
                    </div>
                    
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-primary">
                            <i class="fas fa-layer-group me-1"></i> {{ form.grupo_nomina.label }}
                        </label>
                        {{ form.grupo_nomina }}
                    </div>
                    
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-success">
                            <i class="fas fa-sort-numeric-down me-1"></i> {{ form.orden_informe.label }}
                        </label>
                        {{ form.orden_informe }}
                        <div class="invalid-feedback" id="feedback-orden"></div> 
                    </div>
                </div>
                
                <div class="modal-footer px-0 pb-0">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
(function() {
    const form = document.getElementById('uniorgForm');
    if (!form) return;

    const inputOrden = form.querySelector('#id_orden_informe');
    const feedbackOrden = form.querySelector('#feedback-orden');
    const selectTipo = form.querySelector('select[name="tipo"]');
    const selectPadre = form.querySelector('select[name="padre"]');
    const inputGrupoNomina = form.querySelector('#id_grupo_nomina'); // <-- CAPTURAMOS EL GRUPO

    const currentId = "{{ form.instance.pk|default:'' }}";
    let timerValidacion = null;
    let colisionMensaje = '';

    // --- 1. GESTIÓN DINÁMICA DEL PADRE Y NÓMINA ---
    function sincronizarNomina() {
        if (!inputGrupoNomina || !selectPadre) return;
        
        const opcionTipo = selectTipo.options[selectTipo.selectedIndex];
        const esSubunidad = opcionTipo && opcionTipo.getAttribute('data-subunidad') === 'true';

        if (esSubunidad && selectPadre.value) {
            // Si es subunidad y ya seleccionó un padre, le heredamos la nómina y bloqueamos
            const opcionPadre = selectPadre.options[selectPadre.selectedIndex];
            const grupoPadre = opcionPadre ? opcionPadre.getAttribute('data-grupo-nomina') : '';
            
            if (grupoPadre !== '' && grupoPadre !== null) {
                inputGrupoNomina.value = grupoPadre;
            }
            
            // Usamos readonly para que el dato sí viaje en el POST a la BD
            inputGrupoNomina.setAttribute('readonly', 'readonly');
            inputGrupoNomina.classList.add('bg-light');
            inputGrupoNomina.style.pointerEvents = 'none';
        } else {
            // Si no es subunidad, liberamos el campo para que el usuario escriba su propia nómina
            inputGrupoNomina.removeAttribute('readonly');
            inputGrupoNomina.classList.remove('bg-light');
            inputGrupoNomina.style.pointerEvents = 'auto';
        }
    }

    function evaluarPadre(esCargaInicial = false) {
        if (!selectTipo || !selectPadre) return;
        
        const opcionSeleccionada = selectTipo.options[selectTipo.selectedIndex];
        const esSubunidad = opcionSeleccionada && opcionSeleccionada.getAttribute('data-subunidad') === 'true';

        if (esSubunidad) {
            selectPadre.disabled = false;
            selectPadre.required = true;
        } else {
            selectPadre.disabled = true;
            selectPadre.required = false;
            if (!esCargaInicial) selectPadre.value = ''; 
        }
        
        // Cada vez que cambia el estado del padre, reevaluamos la nómina
        sincronizarNomina();
    }

    if (selectTipo) {
        selectTipo.addEventListener('change', () => evaluarPadre(false));
        if (selectPadre) selectPadre.addEventListener('change', sincronizarNomina);
        
        evaluarPadre(true); // Ejecutar en el arranque inicial (protege datos legados)
    }

    // --- 2. VALIDACIÓN DEL ORDEN (SÚPER BLINDADA) ---
    if (inputOrden) {
        inputOrden.addEventListener('input', function() {
            const valor = this.value.trim();
            inputOrden.classList.remove('is-valid', 'is-invalid');
            colisionMensaje = '';

            if (!valor) return;

            if (!/^\d+$/.test(valor) || parseInt(valor) < 1) {
                inputOrden.classList.add('is-invalid');
                if (feedbackOrden) feedbackOrden.textContent = 'Debe ser un número entero mayor a 0.';
                return;
            }

            clearTimeout(timerValidacion);
            timerValidacion = setTimeout(() => {
                let url = `{% url 'validar_orden_uniorg' %}?orden=${valor}`;
                if (currentId) url += `&exclude_id=${currentId}`;

                fetch(url)
                    .then(res => res.json())
                    .then(data => {
                        if (data.ocupado) {
                            inputOrden.classList.add('is-invalid');
                            colisionMensaje = data.mensaje;
                            if (feedbackOrden) feedbackOrden.textContent = `Ocupado: ${data.mensaje}`;
                        } else {
                            inputOrden.classList.add('is-valid');
                            if (feedbackOrden) feedbackOrden.textContent = '';
                        }
                    });
            }, 300);
        });
    }

    // --- 3. HTMX: CONTROL DE ENVÍO Y RESTAURACIÓN ---
    form.addEventListener('htmx:confirm', function(e) {
        if (e.target.id !== 'uniorgForm') return;
        e.preventDefault(); 

        if(selectPadre) selectPadre.disabled = false;

        const valor = inputOrden ? inputOrden.value.trim() : '';
        const estaOcupado = inputOrden ? inputOrden.classList.contains('is-invalid') : false;

        if (estaOcupado && colisionMensaje) {
            Swal.fire({
                title: 'Posición Ocupada',
                html: `La posición <b>${valor}</b> ya está en uso.<br><br>¿Desea intercalar esta unidad aquí y <b>desplazar</b> las siguientes un puesto hacia abajo?`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ffab00',
                cancelButtonColor: '#8592a3',
                confirmButtonText: '<i class="fas fa-sort-amount-down"></i> Sí, intercalar y desplazar',
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed) {
                    let inputOculto = form.querySelector('input[name="autoriza_desplazamiento"]');
                    if (!inputOculto) {
                        inputOculto = document.createElement('input');
                        inputOculto.type = 'hidden';
                        inputOculto.name = 'autoriza_desplazamiento';
                        form.appendChild(inputOculto);
                    }
                    inputOculto.value = 'true';
                    e.detail.issueRequest(true); 
                } else {
                    evaluarPadre(false);
                }
            });
        } else if (estaOcupado && !colisionMensaje) {
            Swal.fire({ title: 'Atención', text: 'Corrija el Orden de Prioridad antes de continuar.', icon: 'error' });
            evaluarPadre(false);
        } else {
            // CORRECCIÓN: Texto para Edición
            Swal.fire({
                title: '¿Confirmar edición?',
                text: '¿Estás seguro de actualizar los datos de esta unidad organizativa?',
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#696cff',
                cancelButtonColor: '#8592a3',
                confirmButtonText: 'Sí, actualizar',
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed) {
                    let inputOculto = form.querySelector('input[name="autoriza_desplazamiento"]');
                    if (inputOculto) inputOculto.value = 'false';
                    e.detail.issueRequest(true); 
                } else {
                    evaluarPadre(false);
                }
            });
        }
    });

    form.addEventListener('htmx:afterRequest', function(e) {
        if (e.detail.failed) evaluarPadre(false);
    });

})();
</script>
