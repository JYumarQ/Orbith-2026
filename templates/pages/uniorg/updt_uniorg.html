<div class="modal-dialog" role="document">
    <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title" id="uniorgModalLabel">Editar Unidad</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        
        <div class="modal-body">
            <form hx-post="{{ request.path }}" 
                  hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                  hx-target="#modal_generic"
                  hx-swap="innerHTML"
                  hx-confirm="¿Estás seguro de guardar los cambios de la unidad organizativa?"
                  id="uniorgForm">
                
                {% csrf_token %}
                
                {{ form.as_p }}
                
                <div class="modal-footer px-0 pb-0">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function hacerFormularioInteligente() {
        const selectTipo = document.getElementById('id_tipo');
        const inputNomina = document.getElementById('id_grupo_nomina');
        
        // 1. Atrapamos el valor que Django nos mandó desde la vista
        const dgGrupoNomina = "{{ dg_grupo_nomina|default_if_none:'' }}"; 
        
        if (!selectTipo || !inputNomina) return;

        // Guardamos el valor que el usuario escribe por si cambia de opinión
        let valorUsuario = inputNomina.value;
        
        function actualizarEstado() {
            if (selectTipo.value === 'DF') {
                // Si eligen DF, guardamos lo que habían escrito (si no es el de la DG)
                if (inputNomina.value !== dgGrupoNomina) {
                    valorUsuario = inputNomina.value;
                }
                
                inputNomina.setAttribute('readonly', 'readonly');
                inputNomina.style.backgroundColor = '#e9ecef';
                
                // 2. Le inyectamos el número real de la Dirección General
                if (dgGrupoNomina !== "") {
                    inputNomina.value = dgGrupoNomina;
                } else {
                    inputNomina.value = "";
                    inputNomina.placeholder = "Falta crear Dir. General";
                }
                
            } else {
                // Si es UEB o DG, liberamos el campo
                inputNomina.removeAttribute('readonly');
                inputNomina.style.backgroundColor = '';
                inputNomina.placeholder = "";
                
                // 3. Le devolvemos el número que el usuario estaba escribiendo
                if (inputNomina.value === dgGrupoNomina) {
                    inputNomina.value = valorUsuario !== dgGrupoNomina ? valorUsuario : "";
                }
            }
        }
        
        actualizarEstado();
        selectTipo.addEventListener('change', actualizarEstado);
    }
    
    hacerFormularioInteligente();
</script>
