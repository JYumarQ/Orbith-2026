{% extends 'base/base.html' %}
{% load static %}
{% block title %}Panel de Puestos Claves{% endblock %}
{% block content %}
{% comment %} Las utilidades de color y tipografia y el conmutador ya no viven
   aqui: estaban en un <style> privado de esta plantilla, y por eso los otros
   cinco informes usaban los mismos nombres de clase sin que hicieran nada.
   Ahora las define `static/css/informes-rrhh.css`, que carga `base.html`.
{% endcomment %}

<div class="container-xxl flex-grow-1 container-p-y" style="background-color: #F4F7FB;">
    
    {% include 'pages/informes/partials/toolbar_informes.html' with titulo_informe="Resumen Puestos Clave" %}

    {# Cabecera fija y justa en la pantalla (static/css/orbith-tablas.css). #}
    <div class="card border-0 shadow-sm rounded-[1.5rem] overflow-hidden mb-4 orb-tabla-card">
        <div class="card-header border-bottom bg-white py-3 d-flex align-items-center flex-wrap gap-3">
            <div class="me-2">
                <small class="text-muted fw-bold" style="font-size: 11px;"><i class="bx bx-pulse me-1 text-orange-500"></i>Filtros de Análisis Dinámico</small>
            </div>
            
            <form id="form-filtros" class="d-flex align-items-center gap-2 m-0 flex-grow-1" method="GET">
                {% comment %} Solo los filtros PROPIOS de este informe. El de Unidad
                   Organizativa subió a la barra del título: es el único común a los
                   seis informes. {% endcomment %}
                <div class="input-group shadow-sm me-auto" style="width: auto; border: 1px solid #fd7e14; border-radius: 6px; overflow: hidden;">
                    <span class="input-group-text bg-white border-0 text-warning"><i class="bx bx-filter-alt"></i></span>
                    <select name="tipo_familia" class="form-select border-0 shadow-none bg-white text-warning fw-bold" onchange="this.form.submit()">
                        <option value="puestos_clave" {% if tipo_actual == 'puestos_clave' %}selected{% endif %}>⭐ Puestos Clave</option>
                        {% for t in tipos_familia %}
                            <option value="{{ t.pk }}" {% if tipo_actual|add:0 == t.pk %}selected{% endif %}>Tipo: {{ t.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>

                {% comment %} DESGLOSADO / CONSOLIDADO
                   Mismo control de pildora que el «Sector» de Parametros Generales: un
                   <select> oculto detras de dos etiquetas y un fondo que se desliza. Se
                   usa un <select> y no un checkbox porque los dos modos tienen nombre
                   propio y se envian tal cual en la URL, que es lo que heredan el Word y
                   el PDF al exportar. {% endcomment %}
                <div class="d-flex align-items-center gap-1">
                    <div class="agrupacion-toggle" title="Cómo se organiza el informe">
                        {% comment %} Dos radios y no un <select>: los modos son
                           exactamente dos, y con radios un solo clic cambia de modo, como
                           en el «Sector» de Parámetros Generales. Con un <select> el clic
                           abría una lista y hacían falta dos. {% endcomment %}
                        <input type="radio" name="agrupar" id="agrupar_desglosado"
                               value="desglosado" onchange="this.form.submit()"
                               {% if agrupacion == 'desglosado' %}checked{% endif %}>
                        <input type="radio" name="agrupar" id="agrupar_consolidado"
                               value="consolidado" onchange="this.form.submit()"
                               {% if agrupacion != 'desglosado' %}checked{% endif %}>
                        <div class="agrupacion-slider"></div>
                        <label for="agrupar_desglosado" class="agrupacion-option opt-desglosado">Desglosado</label>
                        <label for="agrupar_consolidado" class="agrupacion-option opt-consolidado">Consolidado</label>
                    </div>
                    <button type="button" class="btn btn-link p-0 text-slate-400"
                            style="line-height: 1;"
                            data-bs-toggle="popover"
                            data-bs-trigger="focus"
                            data-bs-placement="bottom"
                            data-bs-title="Desglosado o Consolidado"
                            data-bs-content="Desglosado: cada unidad con sus puestos clave, para ver a quién le faltan plazas. Consolidado: cada cargo una sola vez, sumando todas las unidades."
                            aria-label="Ayuda: Desglosado o Consolidado">
                        <i class="bx bx-help-circle fs-5"></i>
                    </button>
                </div>
            </form>
        </div>

        <div class="card-body bg-slate-50 pt-3 pb-2 border-bottom border-slate-200">
            <div class="row g-3">
                <div class="col-6 col-lg-3">
                    <div class="card bg-white py-2 px-3 rounded-3 border-0 border-b-4 border-b-indigo-600 shadow-sm">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <div class="p-1 bg-indigo-50 text-indigo-600 rounded"><i class="bx bx-award fs-6"></i></div>
                            <span class="text-slate-400 fw-black text-uppercase tracking-widest" style="font-size: 9px;">Plantilla</span>
                        </div>
                        <div class="fs-3 fw-black text-slate-800 lh-1">{{ stats.aprobada }}</div>
                    </div>
                </div>
                <div class="col-6 col-lg-3">
                    <div class="card bg-white py-2 px-3 rounded-3 border-0 border-b-4 border-b-emerald-500 shadow-sm">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <div class="p-1 bg-emerald-50 text-emerald-600 rounded"><i class="bx bx-user-check fs-6"></i></div>
                            <span class="text-slate-400 fw-black text-uppercase tracking-widest" style="font-size: 9px;">Cubierta</span>
                        </div>
                        <div class="fs-3 fw-black text-slate-800 lh-1">{{ stats.cubierta }}</div>
                    </div>
                </div>
                <div class="col-6 col-lg-3">
                    <div class="card bg-white py-2 px-3 rounded-3 border-0 border-b-4 border-b-orange-500 shadow-sm">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <div class="p-1 bg-orange-50 text-orange-500 rounded"><i class="bx bx-user-minus fs-6"></i></div>
                            <span class="text-slate-400 fw-black text-uppercase tracking-widest" style="font-size: 9px;">Vacante</span>
                        </div>
                        <div class="fs-3 fw-black text-slate-800 lh-1">{{ stats.vacante }}</div>
                    </div>
                </div>
                <div class="col-6 col-lg-3">
                    <div class="card py-2 px-3 rounded-3 border-0 shadow-sm text-white position-relative" style="background: linear-gradient(135deg, #4f46e5 0%, #6d28d9 100%);">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <div class="p-1 rounded text-white" style="background-color: rgba(255,255,255,0.1);"><i class="bx bx-pulse fs-6"></i></div>
                            <span class="fw-black text-uppercase tracking-widest" style="font-size: 9px; color: #e0e7ff;">Eficiencia</span>
                        </div>
                        <div class="d-flex align-items-baseline gap-1">
                            <span class="fs-3 fw-black lh-1">{{ stats.porcentaje }}</span>
                            <span class="fs-6 fw-bold opacity-75">%</span>
                        </div>
                        <div class="progress mt-1 w-100 rounded-pill shadow-inner" style="height: 3px; background-color: rgba(255,255,255,0.2);">
                            <div class="progress-bar" role="progressbar" style="width: {{ stats.porcentaje }}%; background-color: #fb923c;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="orb-tabla-scroll">
            <table class="table table-moderna w-100 text-start border-collapse mb-0 orb-tabla-fija">
                <thead>
                    <tr class="bg-slate-50 border-slate-100">
                        <th class="px-4 py-3 text-slate-400 fw-black text-uppercase tracking-widest" style="font-size: 11px;">Cargo u Ocupación</th>
                        <th colspan="4" class="text-center text-indigo-600 fw-black text-uppercase tracking-widest px-2" style="font-size: 11px; background-color: rgba(238, 242, 255, 0.5); border-left: 1px solid rgba(224, 231, 255, 0.5); border-right: 1px solid rgba(224, 231, 255, 0.5);">Plantilla Autorizada</th>
                        <th colspan="3" class="text-center text-orange-500 fw-black text-uppercase tracking-widest px-2" style="font-size: 11px; background-color: rgba(255, 247, 237, 0.5);">Contratos / Otros</th>
                    </tr>
                    <tr class="bg-white border-slate-100">
                        <th class="px-4 py-2 text-slate-400 fw-bold text-uppercase tracking-tighter" style="font-size: 10px;">Descripción Detallada</th>
                        <th class="px-2 py-2 text-center text-slate-500 fw-bold text-uppercase" style="font-size: 10px; background-color: rgba(238, 242, 255, 0.2);">Aprob.</th>
                        <th class="px-2 py-2 text-center text-slate-500 fw-bold text-uppercase" style="font-size: 10px; background-color: rgba(238, 242, 255, 0.2);">Cub.</th>
                        <th class="px-2 py-2 text-center text-slate-500 fw-bold text-uppercase" style="font-size: 10px; background-color: rgba(238, 242, 255, 0.2);">Vac.</th>
                        <th class="px-2 py-2 text-center text-slate-500 fw-bold text-uppercase" style="font-size: 10px; background-color: rgba(238, 242, 255, 0.2); border-right: 1px solid rgba(238, 242, 255, 0.5);">% Efic.</th>
                        <th class="px-2 py-2 text-center text-slate-500 fw-bold text-uppercase" style="font-size: 10px; background-color: rgba(255, 247, 237, 0.2);">Det.</th>
                        <th class="px-2 py-2 text-center text-slate-500 fw-bold text-uppercase" style="font-size: 10px; background-color: rgba(255, 247, 237, 0.2);">Mujeres</th>
                        <th class="px-2 py-2 text-center text-slate-500 fw-bold text-uppercase" style="font-size: 10px; background-color: rgba(255, 247, 237, 0.2);">Adie.</th>
                    </tr>
                </thead>
                <tbody class="border-top-0" data-cifras-url="{% url 'informe_puestos_clave_detalle' %}">
                    {% comment %} El informe se reparte por familia y, dentro de cada
                       una, por Unidad Organizativa: cada unidad encabeza con sus
                       totales y debajo van sus cargos, como el modelo oficial. La
                       unidad se pinta con un partial que se incluye a si mismo, de
                       modo que una direccion principal arrastra a sus subunidades sin
                       duplicar el maquetado. {% endcomment %}
                    {% for familia in datos_familias %}
                        <tr style="background-color: rgba(49, 46, 129, 0.06);" data-p-familia="{{ familia.clave }}">
                            <td class="px-4 py-2">
                                <div class="d-flex align-items-center gap-2">
                                    <div class="rounded-pill" style="width: 5px; height: 18px; background-color: #4f46e5;"></div>
                                    <span class="fw-black text-uppercase tracking-widest" style="font-size: 13px; color: #312e81;">{{ familia.nombre }}</span>
                                </div>
                            </td>
                            <td class="px-2 py-2 text-center font-monospace fw-bold text-slate-600 cifra-pulsable" data-p-columna="aprob" style="font-size: 20px;">{{ familia.subtotales.aprob }}</td>
                            <td class="px-2 py-2 text-center font-monospace fw-bold text-emerald-600 cifra-pulsable" data-p-columna="cub" style="font-size: 20px;">{{ familia.subtotales.cub }}</td>
                            <td class="px-2 py-2 text-center font-monospace fw-bold text-orange-500 cifra-pulsable" data-p-columna="vac" style="font-size: 20px;">{{ familia.subtotales.vac }}</td>
                            <td class="px-2 py-2 text-center"><span class="badge bg-indigo-50 text-indigo-600 fw-black rounded-3" style="font-size: 11px; padding: 0.3rem 0.5rem;">{{ familia.subtotales.porc }}%</span></td>
                            <td class="px-2 py-2 text-center fw-bold text-slate-600 cifra-pulsable" data-p-columna="det" style="font-size: 20px;">{{ familia.subtotales.det }}</td>
                            <td class="px-2 py-2 text-center fw-bold text-slate-600 cifra-pulsable" data-p-columna="muj" style="font-size: 20px;">{{ familia.subtotales.muj }}</td>
                            <td class="px-2 py-2 text-center fw-bold text-slate-600 cifra-pulsable" data-p-columna="adiest" style="font-size: 20px;">{{ familia.subtotales.adiest }}</td>
                        </tr>
                        {% for unidad in familia.unidades %}
                            {% include 'pages/informes/partials/puestos_clave_unidad.html' with unidad=unidad nivel=0 %}
                        {% endfor %}
                    {% empty %}
                        <tr><td colspan="8" class="text-center py-4 text-slate-400 fw-bold">No hay datos registrados para esta selección.</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <div class="bg-slate-900 py-3 px-4 text-white d-flex flex-wrap justify-content-center gap-5" style="border-top: 5px solid #f97316;">
            <div class="d-flex flex-column align-items-center gap-1">
                <div class="d-flex align-items-center gap-1" style="color: #818cf8;">
                    <i class="bx bx-group"></i><span class="fw-black text-uppercase" style="font-size: 9px; letter-spacing: 0.1em;">Mujeres en Puestos</span>
                </div>
                <span class="fw-black lh-1" style="font-size: 1.8rem;">{{ stats.muj }}</span>
            </div>
            <div class="border-end border-light opacity-25" style="width: 1px; height: 35px;"></div>
            <div class="d-flex flex-column align-items-center gap-1">
                <div class="d-flex align-items-center gap-1" style="color: #f59e0b;">
                    <i class="bx bx-trending-up"></i><span class="fw-black text-uppercase" style="font-size: 9px; letter-spacing: 0.1em;">Adiestramiento</span>
                </div>
                <span class="fw-black lh-1" style="font-size: 1.8rem;">{{ stats.adiest }}</span>
            </div>
            <div class="border-end border-light opacity-25" style="width: 1px; height: 35px;"></div>
            <div class="d-flex flex-column align-items-center gap-1">
                <div class="d-flex align-items-center gap-1" style="color: #60a5fa;">
                    <i class="bx bx-time"></i><span class="fw-black text-uppercase" style="font-size: 9px; letter-spacing: 0.1em;">Determinados</span>
                </div>
                <span class="fw-black lh-1" style="font-size: 1.8rem;">{{ stats.det }}</span>
            </div>
        </div>
    </div>
</div>

<script>
    /* La exportacion reutiliza LA MISMA querystring de la pantalla.
       Las dos vistas de exportar heredan de la vista del informe y vuelven a
       leer `request.GET`, asi que pasandole la URL tal cual salen exactamente
       los mismos datos que se estan viendo: las unidades marcadas, la familia
       de cargos y tambien el cierre mensual, que antes se perdia.

       Antes se rehacia a mano con `?ueb={{ ueb_actual }}`, y desde que el filtro
       admite VARIAS unidades ese valor es una lista: la URL salia literalmente
       `?ueb=[]` y el servidor respondia 500. De ahi que no funcionara. */
    function urlDeExportacion(base) {
        var consulta = window.location.search;
        return base + consulta;
    }

    function ejecutarWord() {
        window.mostrarToast('Preparando documento…', 'info');
        window.location.href = urlDeExportacion("{% url 'exportar_puestos_clave_word' %}");
    }
    function ejecutarPDF() {
        window.mostrarToast('Preparando documento…', 'info');
        window.location.href = urlDeExportacion("{% url 'exportar_puestos_clave_pdf' %}");
    }
    function ejecutarExcel() {
        window.mostrarToast('Preparando el libro de Excel…', 'info');
        window.location.href = "{% url 'exportar_puestos_clave_excel' %}" + window.location.search;
    }
</script>
{% include 'pages/informes/partials/cifras_interactivas.html' %}
{% endblock %}
