<option value="">---------</option>
{% for c in cargos %}
    <option value="{{ c.pk }}" 
            data-aprobadas="{{ c.cant_aprobada }}" 
            data-ocupadas="{{ c.plazas_fijas }}"
            data-grupo="{{ c.ncargo.grupo_escala.nivel|default:'' }}"
            data-funcionario="{% if c.funcionario %}true{% else %}false{% endif %}"
            data-designado="{% if c.designado %}true{% else %}false{% endif %}"
            data-de-confianza="{% if c.de_confianza %}true{% else %}false{% endif %}"
            {% comment %} Imprescindible, y con el mismo nombre que emite
               `SelectCargosConPlazasWidget`: este partial es el que rellena el
               desplegable por la cascada HTMX (unidad -> departamento -> cargo),
               mientras que el widget solo pinta las opciones cuando el formulario
               ya llega con cargos cargados (edición). Si falta aquí, la regla que
               impide contratar Indeterminado en un cargo fuera de plantilla se
               aplica al editar pero NO al crear. {% endcomment %}
            data-en-plantilla="{% if c.en_plantilla %}true{% else %}false{% endif %}">
        {{ c.ncargo.descripcion }} {% if c.consecutivo > 0 %}({{ c.consecutivo }}){% endif %}
    </option>
{% endfor %}
