{% if not es_movimiento %}
    <div class="col-md-4">
        <label for="salarioEscala">Salario Escala</label>
        <input class="form-control fw-bold text-primary" id="salarioEscala" name="salarioEscala" readonly value="{{ salario|floatformat:2 }}">
    </div>
    <div class="col-md-4">
        <label for="tarifaHoraria">Tarifa Horaria</label>
        <input class="form-control" id="tarifaHoraria" name="tarifaHoraria" readonly value="{{ tarifa }}">
    </div>
    <div class="col-md-4">
        <label for="tarifaExtras">Tarifa Horas Extras</label>
        <input class="form-control" id="tarifaExtras" name="tarifaExtras" readonly value="{{ extras }}">
    </div>

    <input id="id_rol" value="{{ nuevo_rol }}" class="form-control" readonly placeholder="---" hx-swap-oob="true">
    <input id="id_grupo_escala" value="{{ nuevo_grupo }}" class="form-control" readonly placeholder="---" hx-swap-oob="true">
{% endif %}

<script>
    // 1. Identificamos en qué formulario estamos trabajando
    var formActivo = {% if es_movimiento %} document.getElementById('movimientoForm') {% else %} document {% endif %};
    
    if (formActivo) {
        // 2. Buscamos el Tridente de forma segura (Abarcando Contrato y Movimiento)
        var selTridente = formActivo.querySelector('#id_tridente') || formActivo.querySelector('[name="tridente"]');
        
        if (selTridente) {
            // Evaluamos la decisión del Backend (True/False)
            var debeMostrarTridente = "{{ mostrar_tridente }}" === "True";

            if (!debeMostrarTridente) {
                // MODO CUADRO (O Apoyo/Fundamental sin fondos): Bloqueamos y vaciamos el tridente
                selTridente.disabled = true;
                selTridente.value = ""; // Vaciamos el valor internamente
                
                // Si usas Select2 (Librería de búsqueda en selects)
                if (window.jQuery && $(selTridente).hasClass('select2-hidden-accessible')) {
                    $(selTridente).val(null).trigger('change.select2');
                }
            } else {
                // MODO NORMAL (Fundamental, Decisorio, Apoyo): Habilitamos el tridente
                selTridente.disabled = false;
                
                // Si usas Select2
                if (window.jQuery && $(selTridente).hasClass('select2-hidden-accessible')) {
                    $(selTridente).trigger('change.select2');
                }
            }
        }

        // 3. Sincronización robusta de los datos de Rol y Grupo Ocultos
        var inputRol = formActivo.querySelector('#id_rol') || formActivo.querySelector('#mov_rol');
        if(inputRol) inputRol.value = "{{ nuevo_rol }}";

        var inputGrupo = formActivo.querySelector('#id_grupo_escala') || formActivo.querySelector('#mov_grupo');
        if(inputGrupo) inputGrupo.value = "{{ nuevo_grupo }}";

        // 4. Actualización de dineros
        if(formActivo.querySelector('#salarioEscala')) {
            formActivo.querySelector('#salarioEscala').value = "{{ salario|stringformat:'.2f' }}";
        }
        if(formActivo.querySelector('#tarifaHoraria')) {
            formActivo.querySelector('#tarifaHoraria').value = "{{ tarifa }}";
        }
        if(formActivo.querySelector('#tarifaExtras')) {
            formActivo.querySelector('#tarifaExtras').value = "{{ extras }}";
        }
    }
</script>
