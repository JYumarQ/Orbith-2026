{% if not es_movimiento %}
    <div class="col-md-4">
        <label for="salarioEscala">Salario Escala</label>
        <input class="form-control fw-bold text-primary" id="salarioEscala" name="salarioEscala" readonly value="{{ salario|floatformat:2 }}">
    </div>
    <div class="col-md-4">
        <label for="tarifaHoraria">Tarifa Horaria</label>
        <input class="form-control" id="tarifaHoraria" name="tarifaHoraria" readonly value="{{ tarifa }}">
    </div>
    <div class="col-md-4">
        <label for="tarifaExtras">Tarifa Horas Extras</label>
        <input class="form-control" id="tarifaExtras" name="tarifaExtras" readonly value="{{ extras }}">
    </div>

    <input id="id_rol" value="{{ nuevo_rol }}" class="form-control" readonly placeholder="---" hx-swap-oob="true">
    <input id="id_grupo_escala" value="{{ nuevo_grupo }}" class="form-control" readonly placeholder="---" hx-swap-oob="true">
{% endif %}

<script>
    // 1. Identificamos en qué formulario estamos (Alta o Movimiento)
    var formActivo = {% if es_movimiento %} document.getElementById('movimientoForm') {% else %} document {% endif %};
    
    if (formActivo) {
        var selTridente = formActivo.querySelector('#id_tridente') || formActivo.querySelector('#mov_tridente');
        
        if (selTridente) {
            // 2. Leemos la orden suprema del backend
            var mostrarTridente = "{{ mostrar_tridente|yesno:'true,false' }}" === "true";

            if (!mostrarTridente) {
                // BLOQUEO ABSOLUTO (Es Cuadro, o Salario Fijo, o excepción XXII-XXIV)
                selTridente.value = ''; 
                if(selTridente.options[0]) selTridente.options[0].text = "-------";
                selTridente.disabled = true;
                selTridente.style.backgroundColor = "#e9ecef"; 
                selTridente.style.color = "#a1acb8";
                selTridente.style.cursor = "not-allowed";
                
                // Limpieza para Select2 si se está usando
                if (window.jQuery && $(selTridente).hasClass('select2-hidden-accessible')) {
                    $(selTridente).val(null).trigger('change.select2');
                }
            } else {
                // HABILITADO (Modo normal de matriz)
                if(selTridente.options[0]) selTridente.options[0].text = "---------";
                selTridente.disabled = false;
                selTridente.style.backgroundColor = ""; 
                selTridente.style.color = "";
                selTridente.style.cursor = "";
                
                if (window.jQuery && $(selTridente).hasClass('select2-hidden-accessible')) {
                    $(selTridente).trigger('change.select2');
                }
            }
        }

        // 3. Sincronización de inputs de solo lectura (Movimientos)
        var inputRol = formActivo.querySelector('#mov_rol');
        if(inputRol) inputRol.value = "{{ nuevo_rol }}";

        var inputGrupo = formActivo.querySelector('#mov_grupo');
        if(inputGrupo) inputGrupo.value = "{{ nuevo_grupo }}";

        // 4. Actualización de dineros
        if(formActivo.querySelector('#salarioEscala')) formActivo.querySelector('#salarioEscala').value = "{{ salario|stringformat:'.2f' }}";
        if(formActivo.querySelector('#tarifaHoraria')) formActivo.querySelector('#tarifaHoraria').value = "{{ tarifa }}";
        if(formActivo.querySelector('#tarifaExtras')) formActivo.querySelector('#tarifaExtras').value = "{{ extras }}";
    }
</script>
