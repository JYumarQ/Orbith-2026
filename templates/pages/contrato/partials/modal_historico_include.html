<style>
    /* Estilos base modernos */
    .table-modern { border-collapse: separate; border-spacing: 0; width: 100%; }
    .table-modern thead th {
        background-color: #f8fafc; color: #94a3b8; font-size: 0.65rem;
        text-transform: uppercase; letter-spacing: 0.15em; border-bottom: 1px solid #f1f5f9;
        padding: 1rem 1.5rem;
        /* NUEVO: Hace que el encabezado de la tabla no se mueva */
        position: sticky; 
        top: 0; 
        z-index: 10;
        box-shadow: 0 2px 4px -2px rgba(0,0,0,0.1); /* Sombrita para separar del contenido */
    }
    .table-modern tbody tr { transition: all 0.2s; border-bottom: 1px solid #f8fafc; }
    .table-modern tbody tr:hover { background-color: #f8fafc; }
    .table-modern td { padding: 1rem 1.5rem; vertical-align: middle; font-size: 0.85rem; }

    #tablaHistoricoBody tr {
        cursor: pointer !important;
    }
    .row-selected {
        background-color: rgba(105, 108, 255, 0.1) !important;
    }

    /* Pastillas para los eventos */
    .badge-modern {
        display: inline-flex; align-items: center; gap: 0.5rem;
        padding: 0.35rem 0.75rem; border-radius: 0.75rem; font-size: 0.65rem;
        font-weight: 900; letter-spacing: 0.05em; text-transform: uppercase; border: 1px solid transparent;
    }
    .badge-emerald { background-color: #ecfdf5; color: #059669; border-color: #d1fae5; }
    .badge-blue { background-color: #eff6ff; color: #2563eb; border-color: #dbeafe; }
    .badge-gold { background-color: #fefce8; color: #ca8a04; border-color: #fef08a; }
    .badge-orange { background-color: #fff7ed; color: #ea580c; border-color: #ffedd5; }
    .badge-rose { background-color: #fff1f2; color: #e11d48; border-color: #ffe4e6; }

    /* Pastillas de colores específicos para las Fechas Fin */
    .date-pill {
        display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.25rem 0.6rem;
        border-radius: 0.5rem; font-size: 0.7rem; font-weight: 700; border: 2px solid #f1f5f9;
    }
    .date-normal { background-color: #ffffff; color: #64748b; }
    
    /* Colores personalizados inyectados */
    .fc-verde { color: #059669; border-color: #d1fae5; background-color: #ecfdf5; }
    .fc-azul { color: #2563eb; border-color: #dbeafe; background-color: #eff6ff; }
    .fc-dorado { color: #ca8a04; border-color: #fef08a; background-color: #fefce8; }
    .fc-naranja { color: #ea580c; border-color: #ffedd5; background-color: #fff7ed; }
    .fc-rojo { color: #e11d48; border-color: #ffe4e6; background-color: #fff1f2; }

    /* Fuente monoespaciada */
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

    /* Fila seleccionada */
    .row-selected {
        background-color: rgba(105, 108, 255, 0.08) !important;
        border-left: 4px solid #696cff !important;
    }
    
</style>

<div class="modal fade" id="modalHistorico" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl" role="document">
        <div class="modal-content">
            
            <div class="modal-header bg-label-primary">
                <h5 class="modal-title" id="tituloHistorico">
                    <i class="fas fa-history me-2"></i>Histórico del Trabajador
                </h5>
            </div>
            
            <div class="modal-body bg-lighter" id="areaImpresionHistorico" style="padding: 1.5rem;">
                
                <div class="bg-white p-3 rounded-4 border shadow-sm mb-4 d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center gap-3">
                        <i class="fas fa-user-circle text-secondary" style="font-size: 3.5rem;"></i>
                        <div>
                            <h5 class="fw-bold text-dark mb-0"><span id="histNombre" class="fw-black">Cargando...</span></h5>
                            <span class="small fw-bold text-muted">CI: <span id="histCI"></span> | Exp: <span id="histExp" class="text-primary"></span></span>
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button id="btnExportarMovimiento" disabled class="btn btn-secondary btn-sm rounded-pill px-3 fw-bold" onclick="exportarMovimiento()" style="opacity: 0.5; transition: all 0.3s;">
                            <i class="fas fa-file-export me-1"></i> Exportar Movimiento
                        </button>
                        <button id="btnExportarGeneral" class="btn btn-primary btn-sm rounded-pill px-3 fw-bold shadow-sm" onclick="exportarTodoPDF()">
                            <i class="fas fa-file-pdf me-1"></i> Exportar Todo
                        </button>
                    </div>
                </div>

                <div class="bg-white rounded-4 border shadow-sm overflow-hidden">
                    <div class="table-responsive" style="max-height: 50vh; overflow-y: auto;">
                        <table class="table-modern">
                            <thead>
                                <tr>
                                    <th>Evento</th>
                                    <th>Unidad Organizativa</th>
                                    <th>Cargo</th>
                                    <th class="text-end">Salario</th>
                                    <th class="text-center">Periodo (Inicio / Fin)</th>
                                </tr>
                            </thead>
                            <tbody id="tablaHistoricoBody">
                                <tr><td colspan="6" class="text-center text-muted py-4">Cargando historial...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="modal-footer bg-light py-3 px-4 d-flex justify-content-between align-items-center border-top">
                <span class="text-muted small fw-bold">Total de eventos: <span id="cantEventos" class="text-primary fs-5">0</span></span>
                <button type="button" class="btn btn-secondary fw-bold px-4" data-bs-dismiss="modal">Cerrar</button>
            </div>

        </div>
    </div>
</div>

<script>
    var movimientoSeleccionado = null;
    var aspiranteActualId = null;

    $(document).on('hidden.bs.modal', '#modalHistorico', function () {
        $('.modal-backdrop').remove();
        $('body').removeClass('modal-open').css('padding-right', '');
        
        // --- RESET COMPLETO DE SELECCIÓN Y ESTILOS DEL BOTÓN ---
        $('#tablaHistoricoBody tr').removeClass('row-selected');
        movimientoSeleccionado = null;
        
        const btnExp = document.getElementById('btnExportarMovimiento');
        if (btnExp) {
            btnExp.disabled = true;
            btnExp.classList.remove('btn-primary');
            btnExp.classList.add('btn-secondary');
            btnExp.style.opacity = '0.5';
            btnExp.style.pointerEvents = 'none';
        }
    });

    function abrirModalHistorico(url) {
        // APERTURA SEGURA CON JQUERY (Evita el error 'backdrop undefined')
        $('#modalHistorico').modal('show');
        
        const tbody = document.getElementById('tablaHistoricoBody');
        if(tbody) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4"><div class="spinner-border text-primary" role="status"></div><p class="mt-2">Cargando historial...</p></td></tr>';
        }
        
        if(document.getElementById('histNombre')) document.getElementById('histNombre').innerText = 'Cargando...';
        if(document.getElementById('histCI')) document.getElementById('histCI').innerText = '...';

        fetch(url)
            .then(response => {
                if (!response.ok) throw new Error("Error en la red");
                return response.json();
            })
            .then(data => {
                const historial = data.data;
                const encabezado = data.encabezado;

                if (encabezado) {
                    if(document.getElementById('histNombre')) document.getElementById('histNombre').innerText = encabezado.nombre_completo || '---';
                    if(document.getElementById('histCI')) document.getElementById('histCI').innerText = encabezado.ci || '---';
                    if(document.getElementById('histExp')) document.getElementById('histExp').innerText = encabezado.expediente || '---';
                    aspiranteActualId = encabezado.id; 
                }

                if(tbody) tbody.innerHTML = '';

                if (historial && historial.length > 0) {
                    if(document.getElementById('cantEventos')) document.getElementById('cantEventos').innerText = historial.length;

                    historial.forEach(item => {
                        let icon = 'fa-history'; let cssType = 'default';
                        let colorFinClase = '';
                        
                        if (item.evento === 'Alta Inicial') { icon = 'fa-user-plus'; cssType = 'emerald'; colorFinClase = 'fc-verde'; }
                        else if (item.evento === 'Recontratación') { icon = 'fa-sync-alt'; cssType = 'blue'; colorFinClase = 'fc-azul'; }
                        else if (item.evento === 'Movimiento Cargo') { icon = 'fa-briefcase'; cssType = 'orange'; colorFinClase = 'fc-naranja'; }
                        else if (item.evento === 'Movimiento Salario') { icon = 'fa-coins'; cssType = 'gold'; colorFinClase = 'fc-dorado'; }
                        else if (item.evento === 'Baja') { icon = 'fa-arrow-down'; cssType = 'rose'; colorFinClase = 'fc-rojo'; }

                        const isSalarioCero = (item.salario === '---' || item.salario === '0.00');
                        const salarioHtml = isSalarioCero 
                            ? `<span class="text-muted">${item.salario}</span>`
                            : `<span class="text-success fw-bold"><i class="fas fa-dollar-sign small me-1"></i>${item.salario}</span>`;

                        let finHtml = '';
                        
                        if (item.fecha_fin === 'Actualidad') {
                            // Validamos si la "Actualidad" pertenece a una Baja o a un Contrato Activo
                            if (item.evento === 'Baja') {
                                finHtml = `<div class="date-pill bg-danger text-white border-danger shadow-sm px-2"><i class="fas fa-times-circle"></i> Actualidad</div>`;
                            } else {
                                finHtml = `<div class="date-pill bg-success text-white border-success shadow-sm px-2"><i class="fas fa-check-circle"></i> Actualidad</div>`;
                            }
                        } else if (item.evento === 'Baja') {
                            finHtml = `<div class="date-pill bg-danger text-white border-danger shadow-sm px-2"><i class="fas fa-calendar-times"></i> ${item.fecha_fin}</div>`;
                        } else {
                            finHtml = `<div class="date-pill ${colorFinClase} px-2 fw-bold"><i class="fas fa-calendar-alt opacity-50"></i> ${item.fecha_fin}</div>`;
                        }

                        const fila = `
                            <tr data-id="${item.id}" onclick="seleccionarFila(this)" ondblclick="abrirCapsula(${item.id})">
                                <td>
                                    <div class="badge-modern badge-${cssType}">
                                        <i class="fas ${icon}"></i> ${item.evento}
                                    </div>
                                </td>
                                <td>
                                    <div class="d-flex align-items-center gap-2">
                                        <i class="fas fa-building text-muted opacity-50"></i>
                                        <span class="${item.unidad === '---' ? 'text-muted fst-italic' : 'text-dark fw-medium'}">${item.unidad}</span>
                                    </div>
                                </td>
                                <td>
                                    <span class="${item.cargo === '---' ? 'text-muted' : 'text-dark fw-bold'}">${item.cargo}</span>
                                </td>
                                <td class="text-end">
                                    ${salarioHtml}
                                </td>
                                <td>
                                    <div class="d-flex align-items-center justify-content-center gap-2">
                                        <div class="date-pill date-normal">
                                            <i class="fas fa-calendar-alt text-muted opacity-50"></i> ${item.fecha_inicio_str}
                                        </div>
                                        <i class="fas fa-arrow-right text-muted opacity-25" style="font-size: 0.6rem;"></i>
                                        ${finHtml}
                                    </div>
                                </td>
                            </tr>
                        `;
                        if(tbody) tbody.insertAdjacentHTML('beforeend', fila);
                    });
                } else {
                    if(document.getElementById('cantEventos')) document.getElementById('cantEventos').innerText = '0';
                    if(tbody) tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-5">Este trabajador no tiene historial registrado.</td></tr>';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                if(tbody) tbody.innerHTML = `<tr><td colspan="6" class="text-center text-danger">Error: ${error.message}</td></tr>`;
            });
    }

    function seleccionarFila(fila) {
        // 1. Limpiamos selección previa en la tabla
        document.querySelectorAll('#tablaHistoricoBody tr').forEach(r => r.classList.remove('row-selected'));
        const btnExp = document.getElementById('btnExportarMovimiento');
        
        // 2. Marcamos la fila actual
        fila.classList.add('row-selected');
        
        // 3. Obtenemos el ID del evento
        movimientoSeleccionado = fila.getAttribute('data-id');
        
        // 4. Lógica de activación del botón
        if (btnExp) {
            if (movimientoSeleccionado && movimientoSeleccionado !== 'None' && movimientoSeleccionado !== 'null') {
                btnExp.disabled = false;
                btnExp.classList.remove('btn-secondary');
                btnExp.classList.add('btn-primary');
                btnExp.style.opacity = '1';
                btnExp.style.pointerEvents = 'auto';
            } else {
                btnExp.disabled = true;
                btnExp.classList.remove('btn-primary');
                btnExp.classList.add('btn-secondary');
                btnExp.style.opacity = '0.5';
                btnExp.style.pointerEvents = 'none';
            }
        }
    }

    function abrirCapsula(id) {
        // Validamos solo la existencia del ID, no el tipo de evento
        if (!id || id === 'null' || id === 'None' || id === 'undefined') {
            Swal.fire('Atención', 'Este evento no tiene detalles registrados.', 'info');
            return;
        }
        
        Swal.fire({ 
            title: 'Abriendo cápsula...', 
            allowOutsideClick: false, 
            didOpen: () => { Swal.showLoading() } 
        });
        
        $('#modalMovimientoContrato').remove();

        var url = "{% url 'movimiento_detalle_readonly' 0 %}".replace('0', id);

        $.get(url, function(data) {
            
            // Inyectamos directo al body
            $('body').append(data);
            
            setTimeout(() => {
                Swal.close();
                const $modalCapsula = $('#modalMovimientoContrato');
                
                if ($modalCapsula.length > 0) {
                    $modalCapsula.css('z-index', '3000');

                    const instance = new bootstrap.Modal($modalCapsula[0]);
                    instance.show();

                    $modalCapsula.on('shown.bs.modal', function () {
                        $('.modal-backdrop').last().css('z-index', '2999');
                    });
                    
                    $modalCapsula.on('hidden.bs.modal', function () {
                        $(this).remove();
                        if ($('.modal.show').length > 0) {
                            $('body').addClass('modal-open');
                        }
                    });

                } else {
                    Swal.fire('Error', 'Estructura de ventana incorrecta.', 'error');
                }
            }, 200);
        }).fail(function() {
            Swal.fire('Error', 'No se pudo obtener la información del servidor.', 'error');
        });
    }

    function exportarMovimiento() {
        if (movimientoSeleccionado) {
            window.open(`/contrato/reporte/modelo_movimiento/${movimientoSeleccionado}/`, '_blank');
        }
    }

    function exportarTodoPDF() {
        if (aspiranteActualId) {
            window.open(`/contrato/exportar/historico/pdf/${aspiranteActualId}/`, '_blank');
        } else {
            Swal.fire('Atención', 'No se pudo identificar al trabajador.', 'warning');
        }
    }

    // Lógica para deseleccionar al tocar fuera de las filas
    $(document).on('click', function (e) {
        if ($('#modalHistorico').is(':visible')) {
            // Si el clic NO fue en una fila y NO fue en el botón de exportar ni en exportar todo
            if (!$(e.target).closest('#tablaHistoricoBody tr').length && 
                !$(e.target).closest('#btnExportarMovimiento').length &&
                !$(e.target).closest('#btnExportarGeneral').length) {
                
                // 1. Quitamos la selección visual de la tabla
                $('#tablaHistoricoBody tr').removeClass('row-selected');
                
                // 2. Limpiamos la variable global
                movimientoSeleccionado = null;
                
                // 3. Deshabilitamos y reseteamos estilos del botón
                const btnExp = document.getElementById('btnExportarMovimiento');
                if (btnExp) {
                    btnExp.disabled = true;
                    btnExp.classList.remove('btn-primary');
                    btnExp.classList.add('btn-secondary');
                    btnExp.style.opacity = '0.5';
                    btnExp.style.pointerEvents = 'none';
                }
            }
        }
    });

</script>
