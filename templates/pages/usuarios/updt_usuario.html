<!-- pages/usuarios/updt_usuario.html -->
<div class="modal-dialog" role="document" id="editar_usuario">
  <div class="modal-content">
    <form method="post"
          action="{% url 'updt_usuario' object.id %}"
          id="formEditarUsuario"
          data-user-id="{{ object.id }}"
          data-confirm-text="¿Estás seguro de guardar los cambios para el usuario {{ object.username }}?">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">

      <div class="modal-header">
        <h5 class="modal-title">Editar Usuario</h5>
      </div>

      <div class="modal-body">
        {% include 'base/partials/aviso_origen_edicion.html' %}
        {% include 'base/partials/panel_advertencias_registro.html' %}
        <div class="mb-3">
          <label for="{{ form.username.id_for_label }}" class="form-label">Nombre de usuario</label>
          {{ form.username }}
        </div>

        <div class="form-check form-switch mb-3">
          {{ form.es_admin }}
          <label for="{{ form.es_admin.id_for_label }}" class="form-check-label">
            {{ form.es_admin.label }}
          </label>
        </div>

        <div class="form-check form-switch mb-3">
          {{ form.es_moderador }}
          <label for="{{ form.es_moderador.id_for_label }}" class="form-check-label">
            {{ form.es_moderador.label }}
          </label>
        </div>

        <div class="form-check form-switch mb-3">
          {{ form.es_observador }}
          <label for="{{ form.es_observador.id_for_label }}" class="form-check-label">{{ form.es_observador.label }}</label>
        </div>

        <div class="mb-3">
          <label for="{{ form.contrato.id_for_label }}" class="form-label">Contrato</label>
          {{ form.contrato }}
        </div>

        <div class="mb-3">
          <label for="{{ form.unidades.id_for_label }}" class="form-label">Unidades</label>
          {{ form.unidades }}
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar Cambios</button>
      </div>
    </form>
  </div>
</div>

<script>
  (function() {
    // ======================================================
    // FUNCIÓN GLOBAL PARA HABILITAR/DESHABILITAR UNIDADES
    // ======================================================
    window.toggleUnidades = function() {
      console.log('[DEBUG] Ejecutando toggleUnidades...');
      const $unidades = $('#id_unidades');
      const isAdmin = $('#id_es_admin').is(':checked');
      const isModerador = $('#id_es_moderador').is(':checked');
      const isObservador = $('#id_es_observador').is(':checked');

      console.log('[DEBUG] Admin:', isAdmin, 'Moderador:', isModerador, 'Observador:', isObservador);

      // Primero, eliminar cualquier atributo disabled del select nativo
      $unidades.removeAttr('disabled');

      // Destruir Select2 si existe
      if ($unidades.hasClass('select2-hidden-accessible')) {
        $unidades.select2('destroy');
      }

      // Determinar estado y recrear Select2
      if (isAdmin || isObservador) {
        // Deshabilitado (Admin u Observador)
        $unidades.prop('disabled', true);
        $unidades.select2({
          dropdownParent: $('#editar_usuario'),
          width: '100%',
          placeholder: 'Buscar unidades...',
          allowClear: true,
          theme: 'bootstrap-5',
          disabled: true
        });
        console.log('[DEBUG] Unidades DESHABILITADAS (Admin u Observador)');
      } else if (isModerador) {
        // Habilitado (Moderador)
        $unidades.prop('disabled', false);
        $unidades.select2({
          dropdownParent: $('#editar_usuario'),
          width: '100%',
          placeholder: 'Buscar unidades...',
          allowClear: true,
          theme: 'bootstrap-5',
          disabled: false
        });
        console.log('[DEBUG] Unidades HABILITADAS (Moderador)');
      } else {
        // Deshabilitado (Sin rol)
        $unidades.prop('disabled', true);
        $unidades.select2({
          dropdownParent: $('#editar_usuario'),
          width: '100%',
          placeholder: 'Buscar unidades...',
          allowClear: true,
          theme: 'bootstrap-5',
          disabled: true
        });
        console.log('[DEBUG] Unidades DESHABILITADAS (Sin rol)');
      }
    };

    // ======================================================
    // MUTUAL EXCLUSIÓN DE ROLES
    // ======================================================
    $(document).off('change.rolesEditar').on('change.rolesEditar', 
      '#id_es_admin, #id_es_moderador, #id_es_observador', 
      function (e) {
        const id = e.target.id;
        if (e.target.checked) {
          if (id === 'id_es_admin') {
            $('#id_es_moderador').prop('checked', false);
            $('#id_es_observador').prop('checked', false);
          } else if (id === 'id_es_moderador') {
            $('#id_es_admin').prop('checked', false);
            $('#id_es_observador').prop('checked', false);
          } else if (id === 'id_es_observador') {
            $('#id_es_admin').prop('checked', false);
            $('#id_es_moderador').prop('checked', false);
          }
        }
        // Actualizar el estado del campo unidades
        window.toggleUnidades();
      }
    );

    // ======================================================
    // ENVÍO AJAX CON CONFIRMACIÓN
    // ======================================================
    $(document).on('submit', '#formEditarUsuario', function (e) {
      e.preventDefault();
      const $form = $(this);
      const confirmText = $form.data('confirm-text') || '¿Confirmar acción?';

      const doAjax = () => {
        $.ajax({
          url: $form.attr('action'),
          type: $form.attr('method'),
          data: $form.serialize(),
          dataType: 'json',
          success: function (data) {
            if (data.form_is_valid || data.success) {
              // Se abrió desde fuera de list_usuarios.html (Notificaciones/Subsanación,
              // ver core.mixins.VolverAlOrigenMixin): no hay #filter_usuarios_results
              // al que refrescar, hay que volver a donde estaba el usuario.
              if (data.next_url) {
                window.location.href = data.next_url;
                return;
              }
              $('#editar_usuario').modal('hide');
              if (window.htmx) {
                htmx.ajax('GET', "{% url 'search_usuarios' %}", { target: '#filter_usuarios_results' });
              }
              if (typeof data.es_admin !== 'undefined') {
                $('#id_es_admin').prop('checked', !!data.es_admin);
              }
              if (typeof data.es_moderador !== 'undefined') {
                $('#id_es_moderador').prop('checked', !!data.es_moderador);
              }
              if (window.showToast) showToast(data.message || 'Usuario actualizado', 'success');
            } else if (data.html_form) {
              const $modal = $('#editar_usuario');
              const $newContent = $(data.html_form);
              $modal.find('.modal-content').empty().append($newContent.find('.modal-content').html());
              // Inicializar Select2 para los nuevos campos
              $modal.find('.select2').select2({
                dropdownParent: $modal,
                width: '100%',
                placeholder: 'Buscar...',
                allowClear: true,
                theme: 'bootstrap-5'
              });
              // Forzar actualización después de recargar
              setTimeout(function() {
                window.toggleUnidades();
              }, 300);
            } else {
              if (window.showToast) showToast('No se pudo guardar.', 'danger');
            }
          },
          error: function () {
            if (window.showToast) showToast('Error de red al guardar.', 'danger');
          }
        });
      };

      if (window.Swal && Swal.fire) {
        Swal.fire({
          title: 'Confirmar',
          text: confirmText,
          icon: 'question',
          showCancelButton: true,
          confirmButtonText: 'Sí, guardar',
          cancelButtonText: 'Cancelar'
        }).then((r) => {
          if (r.isConfirmed) doAjax();
        });
      } else {
        if (confirm(confirmText)) doAjax();
      }
    });
  })();
</script>
